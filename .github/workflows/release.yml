name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
      - name: Verify
        shell: bash
        run: |
          npm test
          while IFS= read -r -d '' file; do
            node --check "$file" || exit 1
          done < <(find src test scripts plugin -type f \( -name '*.mjs' -o -name '*.js' \) -print0)
      - name: Pack
        shell: bash
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          npm pack ./plugin --pack-destination dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tgz --clobber
          else
            gh release create "$TAG" dist/*.tgz --generate-notes --verify-tag
          fi
