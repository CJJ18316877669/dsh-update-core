<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek Harness 一键更新</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { margin: 0; padding: 20px; background: var(--bg, #f6f7f9); color: var(--fg, #1f2328); }
  .card { max-width: 900px; margin: 0 auto 16px; background: var(--card, #fff); border: 1px solid var(--border, #e5e7eb); border-radius: 12px; padding: 18px 20px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { margin: 6px 0; color: var(--muted, #6b7280); }
  .versions { display: flex; gap: 28px; margin: 14px 0; }
  .versions div { display: flex; flex-direction: column; gap: 4px; }
  .versions b { font-size: 18px; }
  button { border: 0; border-radius: 8px; padding: 9px 16px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  #check { background: #eef0f3; color: inherit; }
  #update { background: #2563eb; color: #fff; }
  #update:disabled { background: #94a3b8; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #dcfce7; color: #166534; }
  .badge.warn { background: #fef3c7; color: #92400e; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--border, #eee); }
  td:last-child { text-align: right; white-space: nowrap; }
  .tag { font-size: 12px; padding: 2px 7px; border-radius: 999px; background: #eef0f3; }
  .tag.update { background: #dbeafe; color: #1d4ed8; }
  .tag.keep { background: #f1f5f9; color: #475569; }
  pre { white-space: pre-wrap; font-size: 12px; background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 8px; max-height: 220px; overflow: auto; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .meta { font-size: 12px; color: var(--muted, #6b7280); margin-top: 8px; }
  .mini { padding: 4px 8px; font-size: 12px; font-weight: 500; background: #eef0f3; color: inherit; }
  .danger { background: #fee2e2; color: #991b1b; }
  .history { font-size: 12px; }
  .history td { vertical-align: top; }
  .muted { color: var(--muted, #6b7280); }
</style>
</head>
<body>
<div class="card">
  <h1>DeepSeek Harness 一键更新</h1>
  <p>更新官方 Desktop 核心，并把 profile 中的插件升级到与新核心兼容的最高版本。没有兼容版本的插件保持原样，不删除、不主动禁用。</p>
  <div class="versions">
    <div><span>当前核心</span><b id="current">—</b></div>
    <div><span>最新核心</span><b id="latest">—</b></div>
    <div><span>插件</span><b id="pluginSummary">—</b></div>
  </div>
  <div class="row">
    <button id="check">重新检查</button>
    <button id="update" disabled>一键更新并重启</button>
    <button id="rollback" class="mini danger" disabled>回滚上一版本</button>
    <span id="state"></span>
  </div>
  <div class="meta" id="meta"></div>
</div>
<div class="card">
  <h1 style="font-size:16px">插件计划</h1>
  <table>
    <thead><tr><th>插件</th><th>当前</th><th>目标</th><th>处置</th><th>操作</th></tr></thead>
    <tbody id="plugins"><tr><td colspan="5">正在读取…</td></tr></tbody>
  </table>
</div>
<div class="card">
  <h1 style="font-size:16px">更新历史</h1>
  <table class="history">
    <thead><tr><th>时间</th><th>状态</th><th>核心</th><th>插件</th><th>结果</th></tr></thead>
    <tbody id="history"><tr><td colspan="5" class="muted">暂无记录</td></tr></tbody>
  </table>
</div>
<div class="card" id="progressCard" hidden>
  <h1 style="font-size:16px">更新进度</h1>
  <div style="height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:10px 0">
    <div id="progressBar" style="height:100%;width:0;background:#2563eb;transition:width .3s"></div>
  </div>
  <pre id="progress"></pre>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let snapshot = null;
  let runId = null;
  let poll = null;

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  function renderHistory(history) {
    if (!Array.isArray(history) || history.length === 0) {
      $('history').innerHTML = '<tr><td colspan="5" class="muted">暂无记录</td></tr>';
      return;
    }
    $('history').innerHTML = history.map((entry) => {
      const when = entry.startedAt ? new Date(entry.startedAt).toLocaleString() : entry.run;
      const stateClass = entry.state === 'succeeded' ? 'badge' : 'badge warn';
      return '<tr><td>' + esc(when) + '</td>' +
        '<td><span class="' + stateClass + '">' + esc(entry.state) + '</span></td>' +
        '<td>' + esc(entry.coreVersion || entry.targetCore || '—') + '</td>' +
        '<td>' + (entry.updated ? entry.updated.length : 0) + ' 更新 / ' + (entry.kept || 0) + ' 保持</td>' +
        '<td>' + esc(entry.message || '') + (entry.rolledBack ? ' · 已回滚' : '') + '</td></tr>';
    }).join('');
  }

  const STAGES = {
    preparing: '准备更新', 'downloading-core': '下载核心安装包', 'downloading-rollback': '下载回滚安装包',
    starting: '启动更新', closing: '关闭 Desktop', 'installing-core': '安装核心',
    'updating-plugins': '更新插件', 'verifying-app': '启动并验证',
    succeeded: '更新完成', failed: '更新失败', 'rolled-back': '已回滚', 'rolling-back': '正在回滚',
  };

  function renderProgress(result) {
    $('progressCard').hidden = false;
    const stage = STAGES[result.state] || result.state || '更新中';
    const percent = typeof result.percent === 'number' && result.percent >= 0
      ? ` ${Math.round(result.percent)}%` : '';
    const size = result.total ? ` (${(result.total / 1024 / 1024).toFixed(1)} MB)` : '';
    $('progress').textContent = `${stage}${percent}${size}\n${result.message || ''}\n最后更新：${result.updatedAt || '—'}`;
    const bar = $('progressBar');
    if (bar) {
      const pctValue = typeof result.percent === 'number' && result.percent >= 0 ? Math.min(100, result.percent) : null;
      bar.style.width = pctValue === null ? '35%' : pctValue + '%';
      bar.style.background = pctValue === null ? '#93c5fd' : '#2563eb';
    }
  }

  function startPolling(run) {
    runId = run;
    if (poll) clearInterval(poll);
    poll = setInterval(pollResult, 1000);
    pollResult();
  }

  function render(data) {
    snapshot = data;
    $('current').textContent = data.current || '未知';
    $('latest').textContent = data.core.version || '未知';
    $('pluginSummary').textContent = data.plan.updates + ' 个更新 / ' + data.plan.keeps + ' 个保持';
    const core = data.core.update ? '<span class="badge warn">核心有新版</span>' : '<span class="badge">核心已是最新</span>';
    $('state').innerHTML = core;
    $('update').disabled = !data.updateAvailable;
    $('rollback').disabled = !(data.coreState && (data.coreState.rollbackInstaller || data.coreState.rollbackPackage));
    $('meta').textContent = '上次检查 ' + (data.checkedAt ? new Date(data.checkedAt).toLocaleString() : '—') +
      ' · 自动检查每 ' + (data.autoCheckHours || 0) + ' 小时' +
      ' · 自动安装' + (data.autoApply ? '已开启' : '关闭') +
      (data.coreState && data.coreState.rollbackInstaller
        ? ' · 可回滚核心 ' + data.coreState.currentBefore
        : (data.coreState ? ' · 可回滚插件' : ''));
    $('plugins').innerHTML = data.plan.items.map((item) => {
      let action = '<span class="tag ' + (item.action === 'update' ? 'update' : 'keep') + '">' +
        (item.action === 'update' ? '更新' : '保持') + '</span>';
      let button = '';
      if (item.action === 'update') {
        button = '<button class="mini" data-ignore="' + esc(item.name) + '" data-version="' +
          esc(item.version || item.to) + '">忽略此版本</button>';
      } else if (item.reason === 'ignored-version' && data.ignored && data.ignored[item.name]) {
        button = '<button class="mini" data-clear="' + esc(item.name) + '">取消忽略</button>';
        action += ' <span class="tag">已忽略 ' + esc(data.ignored[item.name]) + '</span>';
      } else if (item.reason === 'repository-mismatch') {
        action += ' <span class="tag">仓库不一致</span>';
      }
      return '<tr><td>' + esc(item.name) + '</td><td>' + esc(item.from || '—') + '</td>' +
        '<td>' + esc(item.version || item.to || '不变') + '</td>' +
        '<td>' + action + '</td><td>' + button + '</td></tr>';
    }).join('') || '<tr><td colspan="5">没有插件</td></tr>';
    renderHistory(data.history);
    if (data.activeRun && data.activeRun.run) {
      renderProgress(data.activeRun);
      startPolling(data.activeRun.run);
    }
  }

  async function load() {
    $('check').disabled = true;
    try {
      const response = await fetch('/dsh-update/api/status', { cache: 'no-store' });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || ('HTTP ' + response.status));
      render(data);
    } catch (error) {
      $('state').textContent = '检查失败：' + error.message;
    } finally {
      $('check').disabled = false;
    }
  }

  async function pollResult() {
    if (!runId) return;
    try {
      const response = await fetch('/dsh-update/api/result?run=' + encodeURIComponent(runId), { cache: 'no-store' });
      if (!response.ok) return;
      const result = await response.json();
      renderProgress(result);
      if (['succeeded', 'failed', 'rolled-back'].includes(result.state)) {
        clearInterval(poll);
        poll = null;
        $('state').textContent = result.message || result.state;
        setTimeout(load, 1500);
      }
    } catch { /* app may be closing */ }
  }

  $('check').onclick = load;
  $('update').onclick = async () => {
    if (!snapshot || !snapshot.updateAvailable) return;
    const coreText = snapshot.core.update ? ('核心 ' + snapshot.current + ' → ' + snapshot.core.version) : '核心不变';
    const ok = confirm('即将关闭并重启 DeepSeek Harness。\n' + coreText + '，' + snapshot.plan.updates + ' 个插件更新。\n\n请先保存正在编辑的内容，然后确认继续。');
    if (!ok) return;
    $('update').disabled = true;
    $('progressCard').hidden = false;
    $('progressCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    $('progress').textContent = '正在启动更新…';
    try {
      const response = await fetch('/dsh-update/api/update', {
        method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ confirm: true }),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || ('HTTP ' + response.status));
      startPolling(data.run || data.runDir.split(/[\\/]/).pop());
    } catch (error) {
      $('state').textContent = '更新失败：' + error.message;
      $('update').disabled = false;
    }
  };

  $('plugins').onclick = async (event) => {
    const ignore = event.target.closest('[data-ignore]');
    const clear = event.target.closest('[data-clear]');
    if (!ignore && !clear) return;
    event.preventDefault();
    const body = ignore
      ? { name: ignore.dataset.ignore, version: ignore.dataset.version }
      : { name: clear.dataset.clear, clear: true };
    try {
      const response = await fetch('/dsh-update/api/ignore', {
        method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || ('HTTP ' + response.status));
      render(data);
    } catch (error) {
      $('state').textContent = '操作失败：' + error.message;
    }
  };

  $('rollback').onclick = async () => {
    if (!snapshot || !snapshot.coreState) return;
    if (!confirm('将回滚核心和插件到更新前状态，并重启 DeepSeek Harness。确认继续？')) return;
    $('rollback').disabled = true;
    $('progressCard').hidden = false;
    $('progress').textContent = '正在启动回滚…';
    try {
      const response = await fetch('/dsh-update/api/rollback', {
        method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ confirm: true }),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || ('HTTP ' + response.status));
      startPolling(data.run || data.runDir.split(/[\\/]/).pop());
    } catch (error) {
      $('state').textContent = '回滚失败：' + error.message;
      $('rollback').disabled = false;
    }
  };

  load();
})();
</script>
</body>
</html>
