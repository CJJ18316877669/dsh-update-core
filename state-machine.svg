  <text x="106" y="280" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#9aa4b8" dominant-baseline="central">磁盘 · 权限 · 配置 · 回滚点</text>

  <rect x="60" y="340" width="250" height="60" rx="12" fill="#171c28" stroke="#33405a" stroke-width="0.5"/>
  <rect x="76" y="356" width="20" height="20" rx="6" fill="#232c40"/>
  <text x="86" y="366" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#9fb0ff">4</text>
