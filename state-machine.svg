  <text x="86" y="166" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#9fb0ff">2</text>
  <text x="106" y="162" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#e9edf6" dominant-baseline="central">解析兼容集</text>
  <text x="106" y="180" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#9aa4b8" dominant-baseline="central">engines.dsh · peer · 插件版本</text>

