    </marker>
  </defs>

  <rect x="60" y="40" width="250" height="60" rx="12" fill="#171c28" stroke="#33405a" stroke-width="0.5"/>
  <rect x="76" y="56" width="20" height="20" rx="6" fill="#232c40"/>
  <text x="86" y="66" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#9fb0ff">1</text>
