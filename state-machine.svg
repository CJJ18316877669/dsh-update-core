<svg viewBox="0 0 680 620" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>DeepSeek Harness 一键更新流程与回滚分支</title>
  <desc>主路径为检查更新、解析兼容集、预检与快照、下载与切换、自检与提交；解析阶段可硬阻断并保留当前版本，下载或自检失败会触发自动回滚，回滚失败进入安全模式。</desc>
