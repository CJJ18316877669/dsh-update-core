  <text x="414" y="570" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#c98a8a" dominant-baseline="central">dsh rescue + 诊断报告</text>
  <path d="M510 500L510 530" fill="none" stroke="#8a4046" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <text x="520" y="515" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#b06060" dominant-baseline="central">回滚失败</text>
